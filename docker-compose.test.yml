# Local warehouse clusters for adapter tests.
# Start with `pnpm test:services:start` and stop with `pnpm test:services:stop`.
# Each service is one cluster endpoint. Add the next warehouse beside these
# when its adapter lands, and point that package's tests at the published port.

name: dash-test

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: dash-test-postgres
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - "127.0.0.1:${DASH_TEST_POSTGRES_PORT:-54329}:5432"
    volumes:
      - dash-test-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # pg_isready is true during the entrypoint's temporary server, before
    # fixture SQL runs. Require a fixture view so --wait means the cluster
    # is actually queryable.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dash -d dash && psql -U dash -d dash -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM public.paid_orders LIMIT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

  mysql:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    container_name: dash-test-mysql
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci",
        "--innodb-buffer-pool-size=64M",
        "--performance-schema=OFF",
      ]
    environment:
      MYSQL_ROOT_PASSWORD: dash
      MYSQL_USER: dash
      MYSQL_PASSWORD: dash
      MYSQL_DATABASE: dash
    ports:
      - "127.0.0.1:${DASH_TEST_MYSQL_PORT:-33029}:3306"
    volumes:
      - dash-test-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # mysqladmin ping is true before fixture SQL runs. Require the fixture
    # view so --wait means the cluster is actually queryable.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP --host=127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --database=$$MYSQL_DATABASE --batch --execute='SELECT 1 FROM paid_orders LIMIT 1'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 40s

  mariadb:
    image: mariadb:11.8.9@sha256:6e562000e74ce36a9c7cc1302e462c271e3e3a5e0e7ae0ec2ab5f71f0f586f02
    container_name: dash-test-mariadb
    # The wrapper creates a self-signed certificate, then runs the image entrypoint.
    entrypoint: ["bash", "/opt/dash/tls-entrypoint.sh"]
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
        "--innodb-buffer-pool-size=64M",
        "--performance-schema=OFF",
        "--ssl-cert=/etc/mysql/ssl/server.crt",
        "--ssl-key=/etc/mysql/ssl/server.key",
      ]
    environment:
      MARIADB_ROOT_PASSWORD: dash
      MARIADB_USER: dash
      MARIADB_PASSWORD: dash
      MARIADB_DATABASE: dash
    ports:
      - "127.0.0.1:${DASH_TEST_MARIADB_PORT:-33039}:3306"
    volumes:
      - dash-test-mariadb:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mariadb/tls-entrypoint.sh:/opt/dash/tls-entrypoint.sh:ro
    # A ping can succeed before the fixture SQL runs.
    # Require the fixture view so --wait means the server can answer a query.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb --protocol=TCP --host=127.0.0.1 --user=$$MARIADB_USER --password=$$MARIADB_PASSWORD --database=$$MARIADB_DATABASE --batch --execute='SELECT 1 FROM paid_orders LIMIT 1'",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 40s

  mongodb:
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: dash-test-mongodb
    # Each isolated test database opens its own collection and index files.
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    environment:
      MONGO_INITDB_ROOT_USERNAME: dash
      MONGO_INITDB_ROOT_PASSWORD: dash
      MONGO_INITDB_DATABASE: dash
    ports:
      - "127.0.0.1:${DASH_TEST_MONGODB_PORT:-27029}:27017"
    volumes:
      - dash-test-mongodb:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    # Require the fixture view so --wait means init scripts have finished
    # and the authenticated server is queryable. mongosh --eval is a classic
    # script, so a top-level await is a SyntaxError and the probe can never
    # pass. Await inside an async function, then quit with the result.
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--host",
          "127.0.0.1",
          "--port",
          "27017",
          "-u",
          "dash",
          "-p",
          "dash",
          "--authenticationDatabase",
          "admin",
          "dash",
          "--eval",
          "(async () => { const revenue = await db.revenue.countDocuments(); const paid = await db.paid_orders.countDocuments(); if (revenue !== 3 || paid !== 3) quit(1); quit(0); })()",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:0.8.1@sha256:f4e428d265a93dc5ce36c294e1c584c7c9b384117d47ab8ddbb63d8d50b7f393
    container_name: dash-test-bigquery
    # In-memory emulator with 1 GiB and half a CPU. It keeps every job and
    # loaded row in memory. At 256 MiB, a second development seed load
    # stopped the process. The image entrypoint is the emulator binary; replace it so the fixture
    # view can be created after the YAML seed is loaded.
    entrypoint: ["bash", "/opt/dash/entrypoint.sh"]
    ports:
      - "127.0.0.1:${DASH_TEST_BIGQUERY_PORT:-9059}:9050"
    volumes:
      - ./docker/bigquery/seed.yaml:/seed/analytics.yaml:ro
      - ./docker/bigquery/entrypoint.sh:/opt/dash/entrypoint.sh:ro
      - ./docker/bigquery/healthcheck.sh:/opt/dash/healthcheck.sh:ro
    mem_limit: 1g
    cpus: 0.5
    # The emulator retains every jobs.query. A 2s probe filled a 256 MiB cap
    # in about 15 minutes and the process was OOM-killed. Probe quickly
    # during startup, then every 30s.
    healthcheck:
      test: ["CMD", "bash", "/opt/dash/healthcheck.sh", "view"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

  redshift:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container_name: dash-test-redshift
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    ports:
      - "127.0.0.1:${DASH_TEST_REDSHIFT_PORT:-54399}:5432"
    volumes:
      - dash-test-redshift:/var/lib/postgresql/data
      - ./docker/redshift/init:/docker-entrypoint-initdb.d:ro
    # Amazon Redshift has no local image. This service speaks the PostgreSQL
    # wire protocol on the Redshift default port mapping. pg_isready is true
    # during the entrypoint's temporary server, before fixture SQL runs.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dash -d dash && psql -U dash -d dash -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM public.paid_orders LIMIT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

  databricks:
    build:
      context: ./docker/databricks
    image: dash-test-databricks:local
    container_name: dash-test-databricks
    # Statement Execution API in front of an in-memory DuckDB catalog.
    # 512 MiB covers the Python process and the fixture warehouse.
    ports:
      - "127.0.0.1:${DASH_TEST_DATABRICKS_PORT:-14439}:14439"
    environment:
      DASH_DATABRICKS_TOKEN: ${DASH_TEST_DATABRICKS_TOKEN:-dash}
      DASH_DATABRICKS_WAREHOUSE: ${DASH_TEST_DATABRICKS_WAREHOUSE:-dash}
      DASH_DATABRICKS_CATALOG: ${DASH_TEST_DATABRICKS_CATALOG:-dash}
      DASH_DATABRICKS_SCHEMA: ${DASH_TEST_DATABRICKS_SCHEMA:-analytics}
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "/opt/dash/healthcheck.py"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 15s

  documentdb:
    build:
      context: ./docker/documentdb
    image: dash-test-documentdb:local
    container_name: dash-test-documentdb
    # Amazon DocumentDB has no local image. This service speaks the MongoDB
    # wire protocol with TLS. The adapter tests pass the generated CA as
    # caBundle. Production clusters use the Amazon RDS global bundle.
    environment:
      MONGO_INITDB_ROOT_USERNAME: dash
      MONGO_INITDB_ROOT_PASSWORD: dash
      MONGO_INITDB_DATABASE: dash
    ports:
      - "127.0.0.1:${DASH_TEST_DOCUMENTDB_PORT:-27099}:27017"
    volumes:
      - dash-test-documentdb:/data/db
      - ./docker/documentdb/runtime:/opt/dash/runtime
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    healthcheck:
      test: ["CMD", "bash", "/opt/dash/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 40s

  cockroachdb:
    image: cockroachdb/cockroach:v26.4.1@sha256:13331054ac7b815bcf7d4396e3416d3ef53522be308b5c4a8155079f35fe58a1
    container_name: dash-test-cockroachdb
    # One secure CockroachDB node. SQL requires TLS.
    # Adapter tests read the CA certificate from the host path.
    entrypoint: ["/bin/sh", "/opt/dash/entrypoint.sh"]
    ports:
      - "127.0.0.1:${DASH_TEST_COCKROACHDB_PORT:-26229}:26257"
    volumes:
      - /tmp/dash-test-cockroach-certs:/certs
      - ./docker/cockroachdb/entrypoint.sh:/opt/dash/entrypoint.sh:ro
      - ./docker/cockroachdb/init.sql:/opt/dash/init.sql:ro
      - ./docker/cockroachdb/fixture.sql:/opt/dash/fixture.sql:ro
      - ./docker/cockroachdb/healthcheck.sh:/opt/dash/healthcheck.sh:ro
    mem_limit: 1536m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/dash/healthcheck.sh"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 25s

  neo4j:
    image: neo4j:5.26-community@sha256:635e8376bc9aab806d1563c52afd4dce4e18c06043c3498cc4346bd6928dbdde
    container_name: dash-test-neo4j
    # Community edition. The fixture script loads labels after Bolt accepts
    # connections. The cap leaves room for Neo4j and one cypher-shell JVM.
    entrypoint: ["bash", "/opt/dash/entrypoint.sh"]
    environment:
      NEO4J_AUTH: neo4j/dash
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_dbms_security_auth__minimum__password__length: "4"
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${DASH_TEST_NEO4J_PORT:-17687}:7687"
    volumes:
      - dash-test-neo4j:/data
      - ./docker/neo4j/fixture.cypher:/opt/dash/fixture.cypher:ro
      - ./docker/neo4j/entrypoint.sh:/opt/dash/entrypoint.sh:ro
      - ./docker/neo4j/healthcheck.sh:/opt/dash/healthcheck.sh:ro
    mem_limit: 1400m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "bash", "/opt/dash/healthcheck.sh"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 90s

  cassandra:
    image: cassandra:5.0@sha256:7ec032283c56c9ea7c022007b2fecdf5ca69c7a9871e0634f41ae05833dc1638
    container_name: dash-test-cassandra
    # Cassandra 5.0.9. The wrapper enables password auth and loads the fixture.
    # The native port matches the published host port so the driver can reconnect.
    user: "0:0"
    entrypoint: ["bash", "/opt/dash/entrypoint.sh"]
    environment:
      MAX_HEAP_SIZE: 384M
      MAX_DIRECT_MEMORY_SIZE: 256M
      CASSANDRA_NATIVE_PORT: ${DASH_TEST_CASSANDRA_PORT:-39042}
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
      JVM_EXTRA_OPTS: -Dcassandra.superuser_setup_delay_ms=0
    ports:
      - "127.0.0.1:${DASH_TEST_CASSANDRA_PORT:-39042}:${DASH_TEST_CASSANDRA_PORT:-39042}"
    volumes:
      - dash-test-cassandra:/var/lib/cassandra
      - ./docker/cassandra/entrypoint.sh:/opt/dash/entrypoint.sh:ro
      - ./docker/cassandra/init.cql:/opt/dash/init.cql:ro
      - ./docker/cassandra/healthcheck.sh:/opt/dash/healthcheck.sh:ro
    mem_limit: 1280m
    cpus: 1
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "bash", "/opt/dash/healthcheck.sh"]
      interval: 5s
      timeout: 15s
      retries: 36
      start_period: 120s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: dash-test-clickhouse
    # HTTP interface on 8123. The adapter does not use the native protocol.
    # Init SQL in docker-entrypoint-initdb.d runs once, before the server
    # listens on the published port.
    environment:
      CLICKHOUSE_DB: dash
      CLICKHOUSE_USER: dash
      CLICKHOUSE_PASSWORD: dash
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${DASH_TEST_CLICKHOUSE_PORT:-18123}:8123"
    volumes:
      - dash-test-clickhouse:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "dash",
          "--password",
          "dash",
          "--database",
          "dash",
          "--query",
          "SELECT 1 FROM paid_orders LIMIT 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  stripe:
    build:
      context: ./docker/stripe
    image: dash-test-stripe:local
    container_name: dash-test-stripe
    # Stripe list API in front of a fixed customer and charge fixture.
    # 128 MiB covers the Python process.
    ports:
      - "127.0.0.1:${DASH_TEST_STRIPE_PORT:-12119}:12119"
    environment:
      DASH_STRIPE_KEY: ${DASH_TEST_STRIPE_KEY:-sk_test_dash}
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "/opt/dash/healthcheck.py"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:2.19.7@sha256:d89333b6bd4a13b9a95aef7f373c0a6e73440f59bc0d8d1460f9b347289ed0ef
    container_name: dash-test-opensearch
    # Official OpenSearch image with the security plugin off, so the adapter
    # tests can use HTTP on loopback. Basic auth and SigV4 use a local HTTP
    # server. 512 MiB of heap keeps the single node inside 1536 MiB.
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      bootstrap.memory_lock: "false"
      node.store.allow_mmap: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      action.auto_create_index: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${DASH_TEST_OPENSEARCH_PORT:-9209}:9200"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s'",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

  couchbase:
    image: couchbase:community-7.6.2@sha256:4731f6fb25bbbc1f1f2a78fe18cb0a313792abd13895da25ad7cdd2605a2427c
    container_name: dash-test-couchbase
    # One node with the data, index, and query services. 2 GiB covers the
    # 256 MiB service quotas plus the server process. The init script
    # publishes alternate addresses on the host ports.
    entrypoint: ["bash", "/opt/dash/init.sh"]
    ports:
      - "127.0.0.1:${DASH_TEST_COUCHBASE_PORT:-11299}:11210"
      - "127.0.0.1:${DASH_TEST_COUCHBASE_MGMT_PORT:-18099}:8091"
      - "127.0.0.1:${DASH_TEST_COUCHBASE_QUERY_PORT:-18093}:8093"
    environment:
      COUCHBASE_ADMINISTRATOR_USERNAME: dash
      COUCHBASE_ADMINISTRATOR_PASSWORD: dashdash
      DASH_COUCHBASE_PASSWORD: dashdash
      DASH_COUCHBASE_ALT_HOST: ${DASH_TEST_COUCHBASE_HOST:-127.0.0.1}
      DASH_COUCHBASE_ALT_KV: ${DASH_TEST_COUCHBASE_PORT:-11299}
      DASH_COUCHBASE_ALT_MGMT: ${DASH_TEST_COUCHBASE_MGMT_PORT:-18099}
      DASH_COUCHBASE_ALT_QUERY: ${DASH_TEST_COUCHBASE_QUERY_PORT:-18093}
    volumes:
      - dash-test-couchbase:/opt/couchbase/var
      - ./docker/couchbase/init.sh:/opt/dash/init.sh:ro
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/dash-couchbase-ready && curl -sf -u dash:dashdash http://127.0.0.1:8093/query/service --data-urlencode 'statement=SELECT RAW COUNT(*) FROM dash.analytics.revenue' | tr -d '[:space:]' | grep -F -q '\"results\":[3]'",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 120s

  oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    container_name: dash-test-oracle
    environment:
      ORACLE_PASSWORD: Dash_test1
      APP_USER: dash
      APP_USER_PASSWORD: Dash_test1
    ports:
      - "127.0.0.1:${DASH_TEST_ORACLE_PORT:-15219}:1521"
    shm_size: 1gb
    volumes:
      - ./docker/oracle/init:/container-entrypoint-startdb.d:ro
      - ./docker/oracle/healthcheck.sh:/opt/dash/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/opt/dash/healthcheck.sh"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 180s

volumes:
  dash-test-postgres:
  dash-test-mysql:
  dash-test-mariadb:
  dash-test-mongodb:
  dash-test-redshift:
  dash-test-documentdb:
  dash-test-couchbase:
  dash-test-neo4j:
  dash-test-cassandra:
  dash-test-clickhouse:
